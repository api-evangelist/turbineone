aid: turbineone
name: TurbineOne
description: >-
  TurbineOne builds a frontline AI/ML platform that turns raw sensor data into
  real-time detection, classification, and targeting at the edge for defense and
  national-security missions. Its product suite spans Frontline Perception (edge
  computer vision on live sensor feeds), Frontline Command, Frontline Autonomy, a
  Model Hub for managing and deploying ML models, and EdgeWorks, a program that
  brings warfighters, mission teams, and engineers together to develop and
  validate mission capabilities for contested, disconnected environments. The
  company was founded on expertise in artificial intelligence, mesh networking,
  and sensing technology, and positions its work as "Responsible AI for our
  nation's heroes." It is backed by Bessemer Venture Partners. TurbineOne
  publishes no public developer API, SDK, or documentation surface; this profile
  captures its public identity, GitHub organization, and a live domain-security
  probe.
